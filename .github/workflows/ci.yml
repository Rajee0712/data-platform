name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: UnitTest Coverage summary
        run: |
          echo "## UnitTest Coverage Report" >> $GITHUB_STEP_SUMMARY
          uv run python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Sync README to Wiki
        if: github.ref == 'refs/heads/main'
        run: |
            git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Rajee0712/data-platform.wiki.git wiki
            cp README.md wiki/Home.md
            cd wiki
            git config user.name "Rajee0712"
            git add Home.md
            git diff --staged --quiet || git commit -m "sync README to wiki"
            git push
