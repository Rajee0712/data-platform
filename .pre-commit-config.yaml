repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: local
    hooks:
      - id: claude-review
        name: Claude Code Review
        entry: claude -p "Review this diff for bugs, code quality issues and suggest improvements. Be concise."
        language: system
        pass_filenames: false
        stages: [pre-commit]
